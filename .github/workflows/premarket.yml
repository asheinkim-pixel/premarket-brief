          # 고정 오프셋을 쓰지 않는다. tzdata가 없으면 EST(-5)로 후퇴한다.
          try:
              from zoneinfo import ZoneInfo
              US_ET = ZoneInfo("America/New_York")
          except Exception:                                           # noqa: BLE001
              US_ET = timezone(timedelta(hours=-5))
              print("zoneinfo 사용 불가 — 미국 동부시간을 EST 고정으로 처리",
                    file=sys.stderr)

          # 정규장 종료 + 여유. 이 시각 이전에 찍힌 '오늘' 봉은 미완성으로 본다.
          KR_OPEN        = dtime(9, 0)
          KR_CLOSE_GRACE = dtime(15, 40)   # 한국 정규장 15:30 종료
          US_CLOSE_GRACE = dtime(16, 10)   # 미국 정규장 16:00(ET) 종료

