name: 미장 마감 시세 수집

on:
  schedule:
    # 22:00 UTC = 07:00 KST (일~목 실행 → 한국 월~금 아침)
    - cron: "0 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet yfinance pandas lxml

      - name: 시세 수집
        run: |
          cat > fetch_market.py <<'PYEOF'
          """
          미장 마감 → 국장 개장 전 브리핑: 시세 수집 스크립트

          GitHub Actions에서 매 거래일 실행된다.
          yfinance로 미국(나스닥100 + 섹터 ETF)과 한국(관심 종목) 시세를 받아
          계산까지 마친 JSON을 data/ 아래에 저장한다.

          Claude는 이 JSON만 읽는다. 웹페이지에서 숫자를 긁지 않는다.
          """

          import json
          import os
          import sys
          from datetime import datetime, timedelta, timezone

          import pandas as pd
          import yfinance as yf

          KST = timezone(timedelta(hours=9))

          # ---------------------------------------------------------------- 설정

          SECTOR_ETFS = {
              "XLK": "기술",
              "XLV": "헬스케어",
              "XLF": "금융",
              "XLE": "에너지",
              "XLI": "산업",
              "XLY": "임의소비재",
              "XLP": "필수소비재",
              "XLB": "소재",
              "XLRE": "부동산",
              "XLU": "유틸리티",
              "XLC": "커뮤니케이션",
          }

          # 국내 관심 종목. 코드만 적으면 .KS(코스피) / .KQ(코스닥)를 자동으로 시도한다.
          KR_WATCHLIST = {
              # 반도체 · AI
              "005930": "삼성전자",
              "000660": "SK하이닉스",
              "042700": "한미반도체",
              "007660": "이수페타시스",
              "058470": "리노공업",
              "403870": "HPSP",
              "036930": "주성엔지니어링",
              # 전력기기 · 데이터센터
              "010120": "LS일렉트릭",
              "267260": "HD현대일렉트릭",
              "298040": "효성중공업",
              "001440": "대한전선",
              # 방산
              "012450": "한화에어로스페이스",
              "079550": "LIG넥스원",
              "064350": "현대로템",
              "047810": "한국항공우주",
              # 조선 · 해운
              "009540": "HD한국조선해양",
              "042660": "한화오션",
              "010140": "삼성중공업",
              "028670": "팬오션",
              "005880": "대한해운",
              "011200": "HMM",
              # 2차전지
              "373220": "LG에너지솔루션",
              "006400": "삼성SDI",
              "247540": "에코프로비엠",
              "003670": "포스코퓨처엠",
              # 바이오
              "128940": "한미약품",
              "087010": "펩트론",
              "207940": "삼성바이오로직스",
              # 원자력
              "034020": "두산에너빌리티",
              "052690": "한전기술",
              # 우주 · 위성
              "272210": "한화시스템",
              "451760": "컨텍",
              "211270": "AP위성",
              # 비트코인 연관
              "041190": "우리기술투자",
              "003530": "한화투자증권",
              # 로봇
              "277810": "레인보우로보틱스",
              "454910": "두산로보틱스",
          }

          # 나스닥100 구성 종목을 위키피디아에서 못 받을 때 쓰는 예비 목록.
          # 구성 종목은 바뀌므로 가끔 손으로 갱신할 것.
          NDX_FALLBACK = [
              "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "GOOG", "META", "AVGO", "TSLA",
              "COST", "NFLX", "AMD", "PEP", "ADBE", "CSCO", "LIN", "TMUS", "INTU",
              "TXN", "QCOM", "AMAT", "CMCSA", "AMGN", "ISRG", "HON", "BKNG", "VRTX",
              "ADP", "PANW", "MU", "ADI", "GILD", "REGN", "LRCX", "MDLZ", "SBUX",
              "KLAC", "SNPS", "CDNS", "MELI", "PYPL", "MAR", "CRWD", "CTAS", "ORLY",
              "CSX", "ASML", "ABNB", "MRVL", "FTNT", "ADSK", "DASH", "WDAY", "CHTR",
              "NXPI", "PCAR", "ROP", "TTD", "MNST", "AEP", "PAYX", "ODFL", "FAST",
              "KDP", "ROST", "EA", "VRSK", "DDOG", "BKR", "XEL", "CTSH", "KHC",
              "LULU", "GEHC", "CCEP", "EXC", "TEAM", "MCHP", "IDXX", "ZS",
              "ON", "CSGP", "DXCM", "CDW", "TTWO", "WBD", "GFS", "MDB", "BIIB",
              "ARM", "MSTR", "WDC", "INTC", "SMCI", "PLTR", "APP", "AXON", "SPCX",
          ]

          TOP_GAIN_THRESHOLD = 2.0    # 강세 기준 (%)
          TOP_LOSS_THRESHOLD = -3.0   # 약세 기준 (%)


          # ---------------------------------------------------------------- 유틸

          def pct(a, b):
              """b 대비 a의 변화율(%). 계산 불가면 None."""
              if a is None or b in (None, 0):
                  return None
              return round((a - b) / b * 100, 2)


          def close_position(o, h, l, c):
              """캔들 내 종가 위치(%). 고가=저가면 None."""
              if None in (h, l, c) or h == l:
                  return None
              return round((c - l) / (h - l) * 100, 1)


          def fetch_history(tickers, period="3mo"):
              """여러 종목의 일봉을 받아 {티커: DataFrame}으로 돌려준다."""
              if not tickers:
                  return {}
              raw = yf.download(
                  tickers,
                  period=period,
                  interval="1d",
                  group_by="ticker",
                  auto_adjust=False,
                  progress=False,
                  threads=True,
              )
              out = {}
              for t in tickers:
                  try:
                      df = raw[t] if isinstance(raw.columns, pd.MultiIndex) else raw
                      df = df.dropna(subset=["Close"])
                      if len(df) >= 2:
                          out[t] = df
                  except (KeyError, TypeError):
                      continue
              return out


          def summarize(ticker, df, name=None):
              """마지막 거래일 기준 지표를 뽑는다."""
              last = df.iloc[-1]
              prev = df.iloc[-2]

              o, h, l, c = (
                  float(last["Open"]), float(last["High"]),
                  float(last["Low"]), float(last["Close"]),
              )
              vol = int(last["Volume"]) if not pd.isna(last["Volume"]) else None
              avg_vol = df["Volume"].tail(21).head(20).mean()
              avg_vol = int(avg_vol) if not pd.isna(avg_vol) else None

              row = {
                  "ticker": ticker,
                  "name": name,
                  "date": df.index[-1].strftime("%Y-%m-%d"),
                  "open": round(o, 2),
                  "high": round(h, 2),
                  "low": round(l, 2),
                  "close": round(c, 2),
                  "change_pct": pct(c, float(prev["Close"])),
                  "volume": vol,
                  "avg_volume_20d": avg_vol,
                  "volume_ratio": round(vol / avg_vol, 2) if vol and avg_vol else None,
                  "close_position_pct": close_position(o, h, l, c),
              }

              if len(df) >= 6:
                  row["change_5d_pct"] = pct(c, float(df.iloc[-6]["Close"]))
              return row


          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")


          def _read_tables(url):
              """User-Agent를 붙여 HTML을 받아 표로 파싱한다.

              pandas.read_html 은 기본 요청에 User-Agent가 없어 위키피디아 등에서
              403을 받는다. 직접 받아서 넘긴다.
              """
              import io
              import urllib.request

              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml",
                  "Accept-Language": "en-US,en;q=0.9",
              })
              html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
              return pd.read_html(io.StringIO(html))


          def _extract_symbols(tables):
              """표 목록에서 티커 열을 찾아 90~110개짜리 목록을 돌려준다."""
              for t in tables:
                  cols = [str(c).strip().lower() for c in t.columns]
                  for key in ("ticker", "symbol", "ticker symbol"):
                      if key in cols:
                          col = t[t.columns[cols.index(key)]]
                          syms = [str(s).strip().upper().replace(".", "-")
                                  for s in col.tolist() if str(s).strip()]
                          syms = [s for s in syms if 1 <= len(s) <= 6 and s.isascii()]
                          if 90 <= len(syms) <= 110:
                              return syms
              return None


          def get_ndx_tickers():
              """나스닥100 구성 종목.

              출처를 순서대로 시도하고, 전부 실패하면 예비 목록을 쓴다.
              예비 목록은 시간이 지나면 낡으므로 ndx_source 값을 항상 확인할 것.
              """
              sources = [
                  ("wikipedia", "https://en.wikipedia.org/wiki/Nasdaq-100"),
                  ("slickcharts", "https://www.slickcharts.com/nasdaq100"),
              ]
              for name, url in sources:
                  try:
                      syms = _extract_symbols(_read_tables(url))
                      if syms:
                          print(f"나스닥100 구성 종목 수신 ({name}): {len(syms)}종목")
                          return syms, name
                      print(f"{name}: 티커 열을 찾지 못함", file=sys.stderr)
                  except Exception as e:                              # noqa: BLE001
                      print(f"{name} 조회 실패: {e}", file=sys.stderr)

              print("모든 출처 실패 — 예비 목록 사용 (낡았을 수 있음)", file=sys.stderr)
              return sorted(set(NDX_FALLBACK)), "fallback"


          def resolve_kr(code):
              """코스피(.KS) → 코스닥(.KQ) 순으로 시도해 데이터가 있는 쪽을 쓴다."""
              for suffix in (".KS", ".KQ"):
                  sym = code + suffix
                  try:
                      df = yf.Ticker(sym).history(period="3mo", auto_adjust=False)
                      if len(df.dropna(subset=["Close"])) >= 2:
                          return sym, df.dropna(subset=["Close"])
                  except Exception:                                   # noqa: BLE001
                      continue
              return None, None


          # ---------------------------------------------------------------- 본체

          def main():
              now_kst = datetime.now(KST)
              print(f"실행 시각 (KST): {now_kst:%Y-%m-%d %H:%M}")

              result = {
                  "generated_at_kst": now_kst.strftime("%Y-%m-%d %H:%M:%S"),
                  "thresholds": {"gain": TOP_GAIN_THRESHOLD, "loss": TOP_LOSS_THRESHOLD},
                  "errors": [],
              }

              # --- 미국 섹터 ETF
              etf_hist = fetch_history(list(SECTOR_ETFS))
              sectors = []
              for tkr, kor in SECTOR_ETFS.items():
                  if tkr not in etf_hist:
                      result["errors"].append(f"섹터 ETF 수신 실패: {tkr}")
                      continue
                  row = summarize(tkr, etf_hist[tkr], kor)
                  sectors.append(row)
              sectors.sort(key=lambda r: r["change_pct"] or -999, reverse=True)
              result["sectors"] = sectors
              result["us_date"] = sectors[0]["date"] if sectors else None

              # --- 나스닥100
              ndx, ndx_source = get_ndx_tickers()
              result["ndx_source"] = ndx_source
              ndx_hist = fetch_history(ndx)
              ndx_rows = []
              for tkr in ndx:
                  if tkr not in ndx_hist:
                      continue
                  ndx_rows.append(summarize(tkr, ndx_hist[tkr]))

              result["ndx_count"] = len(ndx_rows)
              result["ndx_gainers"] = sorted(
                  [r for r in ndx_rows if (r["change_pct"] or 0) >= TOP_GAIN_THRESHOLD],
                  key=lambda r: r["change_pct"], reverse=True,
              )
              result["ndx_losers"] = sorted(
                  [r for r in ndx_rows if (r["change_pct"] or 0) <= TOP_LOSS_THRESHOLD],
                  key=lambda r: r["change_pct"],
              )
              # 거래량이 평소보다 크게 실린 종목 (등락 방향 무관)
              result["ndx_volume_spikes"] = sorted(
                  [r for r in ndx_rows if (r["volume_ratio"] or 0) >= 2.0],
                  key=lambda r: r["volume_ratio"], reverse=True,
              )[:15]

              # --- 국내 관심 종목
              kr_rows = []
              for code, name in KR_WATCHLIST.items():
                  sym, df = resolve_kr(code)
                  if df is None:
                      result["errors"].append(f"국내 종목 수신 실패: {name}({code})")
                      continue
                  row = summarize(sym, df, name)
                  row["code"] = code
                  kr_rows.append(row)
              kr_rows.sort(key=lambda r: r["change_pct"] or -999, reverse=True)
              result["kr_watchlist"] = kr_rows
              result["kr_date"] = kr_rows[0]["date"] if kr_rows else None

              # --- 저장
              os.makedirs("data", exist_ok=True)
              stamp = now_kst.strftime("%Y-%m-%d")
              for path in (f"data/{stamp}.json", "data/latest.json"):
                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(result, f, ensure_ascii=False, indent=2)

              print(f"미국 기준일: {result['us_date']} / 한국 기준일: {result['kr_date']}")
              print(f"나스닥100 수신 {result['ndx_count']}종목 "
                    f"(강세 {len(result['ndx_gainers'])} / 약세 {len(result['ndx_losers'])})")
              print(f"국내 수신 {len(kr_rows)}종목")
              if result["errors"]:
                  print("경고:", *result["errors"], sep="\n  ")


          if __name__ == "__main__":
              main()
          PYEOF
          python fetch_market.py

      - name: 결과 커밋
        run: |
          git config user.name  "premarket-bot"
          git config user.email "premarket-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "시세 수집 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git push
          fi
