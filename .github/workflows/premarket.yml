          # ---------------------------------------------------------------- 유틸

          def pct(a, b):
              """b 대비 a의 변화율(%). 계산 불가면 None."""
              if a is None or b in (None, 0):
                  return None
              return round((a - b) / b * 100, 2)


          def close_position(o, h, l, c):
              """캔들 내 종가 위치(%). 고가=저가면 None."""
              if None in (h, l, c) or h == l:
                  return None
              return round((c - l) / (h - l) * 100, 1)


          # ------------------------------------------------- 미완성 봉 방어 (핵심)
          #
          # 2026-09-01 11:00 KST 수동 실행에서 확인된 사고:
          #   장중에 돌리자 yfinance가 '진행 중인 오늘 봉'을 돌려줬고, 스크립트는
          #   그것을 종가로 기록했다. 관심종목 37개 중 28개, 스캔 20개 전부가
          #   당일 미완성 봉이었다.
          #
          #   결과적으로 거래량비 중앙값이 0.23으로 찍혔다. 하루치 평균 거래량과
          #   2시간치 거래량을 비교했기 때문이다. 브리핑은 거래량비와 종가위치로
          #   수급을 판정하므로, 이 데이터를 쓰면 "수급이 안 실렸다"는 정반대
          #   결론이 나온다. 고가·저가도 아직 확정되지 않은 값이다.
          #
          # → 세션이 끝나지 않은 당일 봉은 무조건 잘라낸다.

          def drop_incomplete_bar(df, market, now_kst):
              """진행 중인 당일 봉을 잘라낸다. (잘라낸 DataFrame, 잘랐는지 여부)"""
              if df is None or len(df) == 0:
                  return df, False

              if market == "KR":
                  now_local, grace = now_kst, KR_CLOSE_GRACE
              else:
                  now_local, grace = now_kst.astimezone(US_ET), US_CLOSE_GRACE

              try:
                  last_date = df.index[-1].date()
              except AttributeError:
                  return df, False

              if last_date == now_local.date() and now_local.time() < grace:
                  return df.iloc[:-1], True
              return df, False


          def consensus_date(rows, label, errors):
              """행들의 기준일 최빈값을 돌려준다. 날짜가 섞여 있으면 errors에 남긴다.

              예전에는 `rows[0]["date"]` 를 썼는데, rows가 등락률 내림차순으로
              정렬된 뒤라 '등락률 1위 종목 하나의 날짜'였다. 대표값이 아니었고,
              날짜가 섞여도 이 필드로는 알 수 없었다.
              """
              counts = Counter(r["date"] for r in rows if r.get("date"))
              if not counts:
                  return None
              if len(counts) > 1:
                  errors.append(
                      f"{label} 기준일 불일치 — 종목마다 날짜가 다릅니다: {dict(counts)}. "
                      f"이 데이터는 브리핑에 쓰지 마십시오."
                  )
              return counts.most_common(1)[0][0]


          def prev_business_day(d):
              """주말만 건너뛴 직전 영업일. 공휴일은 반영하지 못한다."""
              d -= timedelta(days=1)
              while d.weekday() >= 5:
                  d -= timedelta(days=1)
              return d


          def fetch_one(ticker, period="3mo"):
              """종목 하나를 개별 조회한다. 실패하면 None."""
              try:
                  df = yf.Ticker(ticker).history(
                      period=period, interval="1d", auto_adjust=False
                  )
                  df = df.dropna(subset=["Close"])
                  return df if len(df) >= 2 else None
              except Exception:                                       # noqa: BLE001
                  return None


          def fetch_history(tickers, period="3mo", threads=True):
              """여러 종목의 일봉을 받아 {티커: DataFrame}으로 돌려준다.

              일괄 조회에서 빠진 종목은 개별로 다시 시도한다. yfinance의 시간대
              캐시(sqlite)가 스레드 경합으로 'database is locked'를 내는 경우가
              있는데, 재시도로 대부분 회수된다.
              """
              if not tickers:
                  return {}

              out = {}
              try:
                  raw = yf.download(
                      tickers,
                      period=period,
                      interval="1d",
                      group_by="ticker",
                      auto_adjust=False,
                      progress=False,
                      threads=threads,
                  )
                  for t in tickers:
                      try:
                          df = raw[t] if isinstance(raw.columns, pd.MultiIndex) else raw
                          df = df.dropna(subset=["Close"])
                          if len(df) >= 2:
                              out[t] = df
                      except (KeyError, TypeError):
                          continue
              except Exception as e:                                  # noqa: BLE001
                  print(f"일괄 조회 실패, 개별 조회로 전환: {e}", file=sys.stderr)

              missing = [t for t in tickers if t not in out]
              if missing:
                  print(f"개별 재시도 {len(missing)}종목: {', '.join(missing[:10])}"
                        f"{' 외' if len(missing) > 10 else ''}")
                  for t in missing:
                      for attempt in range(3):
                          df = fetch_one(t, period)
                          if df is not None:
                              out[t] = df
                              print(f"  {t} 회수 성공 ({attempt + 1}회차)")
                              break
                          time.sleep(2 * (attempt + 1))   # 2초 → 4초 → 6초
                      else:
                          print(f"  {t} 회수 실패 (3회 시도)")

              return out


          def summarize(ticker, df, name=None):
              """마지막 거래일 기준 지표를 뽑는다."""
              last = df.iloc[-1]
              prev = df.iloc[-2]

              o, h, l, c = (
                  float(last["Open"]), float(last["High"]),
                  float(last["Low"]), float(last["Close"]),
              )
              vol = int(last["Volume"]) if not pd.isna(last["Volume"]) else None
              avg_vol = df["Volume"].tail(21).head(20).mean()
              avg_vol = int(avg_vol) if not pd.isna(avg_vol) else None

              row = {
                  "ticker": ticker,
                  "name": name,
                  "date": df.index[-1].strftime("%Y-%m-%d"),
                  "open": round(o, 2),
                  "high": round(h, 2),
                  "low": round(l, 2),
                  "close": round(c, 2),
                  "change_pct": pct(c, float(prev["Close"])),
                  "volume": vol,
                  "avg_volume_20d": avg_vol,
                  "volume_ratio": round(vol / avg_vol, 2) if vol and avg_vol else None,
                  "close_position_pct": close_position(o, h, l, c),
              }

              if len(df) >= 6:
                  row["change_5d_pct"] = pct(c, float(df.iloc[-6]["Close"]))
              return row


          def summarize_market(ticker, df, name, market, now_kst, stats):
              """미완성 당일 봉을 걷어낸 뒤 summarize 한다. 데이터가 모자라면 None.

              봉을 잘라내면 avg_volume_20d와 change_5d_pct의 기준 구간도 함께
              한 칸씩 밀린다. summarize가 잘린 DataFrame만 보므로 자동으로 맞는다.
              """
              df, dropped = drop_incomplete_bar(df, market, now_kst)
              if dropped:
                  stats[market] = stats.get(market, 0) + 1
              if df is None or len(df) < 2:
                  return None
              return summarize(ticker, df, name)


          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")


          def _read_tables(url):
              """User-Agent를 붙여 HTML을 받아 표로 파싱한다.

              pandas.read_html 은 기본 요청에 User-Agent가 없어 위키피디아 등에서
              403을 받는다. 직접 받아서 넘긴다.
              """
              import io
              import urllib.request

              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml",
                  "Accept-Language": "en-US,en;q=0.9",
              })
              html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
              return pd.read_html(io.StringIO(html))


          def _extract_symbols(tables):
              """표 목록에서 티커 열을 찾아 90~110개짜리 목록을 돌려준다.

              열 이름이 다층(MultiIndex)이거나 'Ticker symbol'처럼 변형된 경우도
              잡히도록 부분 일치로 찾는다.
              """
              for t in tables:
                  cols = []
                  for c in t.columns:
                      if isinstance(c, tuple):
                          c = " ".join(str(x) for x in c if "Unnamed" not in str(x))
                      cols.append(str(c).strip().lower())

                  for i, name in enumerate(cols):
                      if "ticker" not in name and "symbol" not in name:
                          continue
                      syms = [str(s).strip().upper().replace(".", "-")
                              for s in t[t.columns[i]].tolist() if str(s).strip()]
                      syms = [s for s in syms
                              if 1 <= len(s) <= 6 and s.isascii() and s.replace("-", "").isalpha()]
                      if 90 <= len(syms) <= 110:
                          return syms
              return None


          def get_ndx_tickers():
              """나스닥100 구성 종목.

              출처를 순서대로 시도하고, 전부 실패하면 예비 목록을 쓴다.
              예비 목록은 시간이 지나면 낡으므로 ndx_source 값을 항상 확인할 것.
              """
              sources = [
                  ("wikipedia", "https://en.wikipedia.org/wiki/Nasdaq-100"),
                  ("slickcharts", "https://www.slickcharts.com/nasdaq100"),
              ]
              for name, url in sources:
                  try:
                      syms = _extract_symbols(_read_tables(url))
                      if syms:
                          print(f"나스닥100 구성 종목 수신 ({name}): {len(syms)}종목")
                          return syms, name
                      print(f"{name}: 티커 열을 찾지 못함", file=sys.stderr)
                  except Exception as e:                              # noqa: BLE001
                      print(f"{name} 조회 실패: {e}", file=sys.stderr)

              print("모든 출처 실패 — 예비 목록 사용 (낡았을 수 있음)", file=sys.stderr)
              return sorted(set(NDX_FALLBACK)), "fallback"


          def resolve_kr(code):
              """코스피(.KS) → 코스닥(.KQ) 순으로 시도해 데이터가 있는 쪽을 쓴다."""
              for suffix in (".KS", ".KQ"):
                  sym = code + suffix
                  try:
                      df = yf.Ticker(sym).history(period="3mo", auto_adjust=False)
                      if len(df.dropna(subset=["Close"])) >= 2:
                          return sym, df.dropna(subset=["Close"])
                  except Exception:                                   # noqa: BLE001
                      continue
              return None, None


          # ---------------------------------------------------------------- 국내 전체 스캔

          SCAN_VOLUME_RATIO = 2.0                 # 거래량 20일 평균 대비 배수 기준
          SCAN_CHANGE_PCT = 5.0                   # 등락률 기준 (%)
          SCAN_TOP_N = 20                         # 최종 보고 종목 수


          def _is_excluded_name(name):
              """스팩·우선주·리츠 등 단타 스크리닝에 부적합한 종목명을 걸러낸다."""
              if not name:
                  return True
              if "스팩" in name:
                  return True
              if name.endswith(("우", "우B", "우C", "1우", "2우B", "3우B")):
                  return True
              return False


          def scan_kr_universe(watchlist_codes, now_kst, stats, errors):
              """코스피 시총 상위 종목에서 거래량 급증 또는 급등 종목을 찾는다.

              관심 종목 37개 밖의 국내 단독 재료를 잡기 위한 단계다.
              KRX(pykrx)는 GitHub Actions에서 차단되므로 yfinance로 받는다.
              """
              codes = [c for c in KR_UNIVERSE if c not in watchlist_codes]
              symbols = [c + ".KS" for c in codes]
              print(f"국내 유니버스 스캔 시작: {len(symbols)}종목")

              hist = {}
              CHUNK = 60
              for i in range(0, len(symbols), CHUNK):
                  part = symbols[i:i + CHUNK]
                  hist.update(fetch_history(part))
                  print(f"  {min(i + CHUNK, len(symbols))}/{len(symbols)} 수신 "
                        f"(누적 {len(hist)}종목)")

              if not hist:
                  return None, "국내 유니버스 시세 수신 실패"

              # 먼저 전 종목을 요약한다. 기준일은 걸러내기 전 전체에서 뽑아야
              # 대표성이 있다. (예전에는 상위 1종목의 날짜를 그대로 썼다.)
              all_rows = []
              for sym, df in hist.items():
                  code = sym.split(".")[0]
                  r = summarize_market(sym, df, KR_UNIVERSE.get(code), "KR",
                                       now_kst, stats)
                  if r is None:
                      continue
                  r["code"] = code
                  r["in_watchlist"] = False
                  all_rows.append(r)

              if not all_rows:
                  return None, "국내 유니버스 요약 실패 (유효한 봉 없음)"

              date = consensus_date(all_rows, "국내 전체 스캔", errors)

              rows = []
              for r in all_rows:
                  if r["change_pct"] is None or r["volume_ratio"] is None:
                      continue
                  # 선정 기준: 거래량 급증 또는 큰 등락
                  if r["volume_ratio"] < SCAN_VOLUME_RATIO and abs(r["change_pct"]) < SCAN_CHANGE_PCT:
                      continue
                  if _is_excluded_name(r["name"]):
                      continue
                  rows.append(r)

              rows.sort(key=lambda x: x["volume_ratio"] * 2 + abs(x["change_pct"]) / 5,
                        reverse=True)
              out = rows[:SCAN_TOP_N]

              print(f"국내 유니버스 스캔: 수신 {len(hist)}종목 → 요약 {len(all_rows)} "
                    f"→ 조건 통과 {len(rows)} → 보고 {len(out)}종목")
              return {"date": date, "universe_size": len(symbols),
                      "received": len(hist), "summarized": len(all_rows),
                      "passed": len(rows), "candidates": out,
                      "criteria": {"volume_ratio": SCAN_VOLUME_RATIO,
                                   "change_pct": SCAN_CHANGE_PCT}}, None


          # ---------------------------------------------------------------- 본체

          def main():
              now_kst = datetime.now(KST)
              print(f"실행 시각 (KST): {now_kst:%Y-%m-%d %H:%M}")

              result = {
                  "generated_at_kst": now_kst.strftime("%Y-%m-%d %H:%M:%S"),
                  "thresholds": {"gain": TOP_GAIN_THRESHOLD, "loss": TOP_LOSS_THRESHOLD},
                  "errors": [],
              }
              errors = result["errors"]
              stats = {}          # 미완성 봉을 잘라낸 횟수 (시장별)

              # 한국장 개장 중 실행은 개장 전 브리핑 용도로 맞지 않는다.
              # 당일 봉은 아래에서 걷어내므로 데이터가 오염되지는 않지만,
              # 그 경우 직전 거래일 종가를 쓰게 되므로 사실을 남겨둔다.
              if now_kst.weekday() < 5 and KR_OPEN <= now_kst.time() < KR_CLOSE_GRACE:
                  errors.append(
                      f"한국장 개장 중 실행됨 ({now_kst:%H:%M} KST). 당일 미완성 봉은 "
                      f"제외했고 직전 거래일 종가를 담았습니다. 개장 전 브리핑 용도로는 "
                      f"실행 시각을 확인하십시오."
                  )

              # 시간대 캐시(sqlite)를 단일 스레드로 미리 한 번 채워둔다.
              # 여러 스레드가 빈 캐시에 동시에 쓰려 하면 'database is locked'가 나면서
              # 종목이 통째로 누락된다. 미리 만들어두면 이후 병렬 조회가 읽기만 한다.
              warm = fetch_one("SPY", period="5d")
              print(f"시간대 캐시 예열: {'성공' if warm is not None else '실패(계속 진행)'}")

              # --- 미국 섹터 ETF (11개뿐이라 순차 조회해도 느리지 않다)
              etf_hist = fetch_history(list(SECTOR_ETFS), threads=False)
              sectors = []
              for tkr, kor in SECTOR_ETFS.items():
                  if tkr not in etf_hist:
                      errors.append(f"섹터 ETF 수신 실패: {tkr}")
                      continue
                  row = summarize_market(tkr, etf_hist[tkr], kor, "US", now_kst, stats)
                  if row is None:
                      errors.append(f"섹터 ETF 유효 봉 부족: {tkr}")
                      continue
                  sectors.append(row)
              # 기준일은 정렬 전에 뽑는다 (정렬 후 [0]은 '가장 많이 오른 종목'이다)
              result["us_date"] = consensus_date(sectors, "미국 섹터", errors)
              sectors.sort(key=lambda r: r["change_pct"] or -999, reverse=True)
              result["sectors"] = sectors

              # --- 나스닥100
              ndx, ndx_source = get_ndx_tickers()
              result["ndx_source"] = ndx_source
              ndx_hist = fetch_history(ndx)
              ndx_rows = []
              for tkr in ndx:
                  if tkr not in ndx_hist:
                      continue
                  row = summarize_market(tkr, ndx_hist[tkr], None, "US", now_kst, stats)
                  if row is not None:
                      ndx_rows.append(row)

              result["ndx_count"] = len(ndx_rows)
              # 나스닥100 쪽 날짜도 확인한다. 섹터 ETF와 다르면 수집이 어긋난 것이다.
              ndx_date = consensus_date(ndx_rows, "나스닥100", errors)
              result["ndx_date"] = ndx_date
              if ndx_date and result["us_date"] and ndx_date != result["us_date"]:
                  errors.append(
                      f"미국 기준일 불일치 — 섹터 ETF {result['us_date']} / "
                      f"나스닥100 {ndx_date}"
                  )
              result["ndx_gainers"] = sorted(
                  [r for r in ndx_rows if (r["change_pct"] or 0) >= TOP_GAIN_THRESHOLD],
                  key=lambda r: r["change_pct"], reverse=True,
              )
              result["ndx_losers"] = sorted(
                  [r for r in ndx_rows if (r["change_pct"] or 0) <= TOP_LOSS_THRESHOLD],
                  key=lambda r: r["change_pct"],
              )
              # 거래량이 평소보다 크게 실린 종목 (등락 방향 무관)
              result["ndx_volume_spikes"] = sorted(
                  [r for r in ndx_rows if (r["volume_ratio"] or 0) >= 2.0],
                  key=lambda r: r["volume_ratio"], reverse=True,
              )[:15]

              # --- 국내 관심 종목
              kr_rows = []
              for code, name in KR_WATCHLIST.items():
                  sym, df = resolve_kr(code)
                  if df is None:
                      errors.append(f"국내 종목 수신 실패: {name}({code})")
                      continue
                  row = summarize_market(sym, df, name, "KR", now_kst, stats)
                  if row is None:
                      errors.append(f"국내 종목 유효 봉 부족: {name}({code})")
                      continue
                  row["code"] = code
                  kr_rows.append(row)
              # 기준일은 정렬 전에 뽑는다 (정렬 후 [0]은 '가장 많이 오른 종목'이다)
              result["kr_date"] = consensus_date(kr_rows, "국내 관심종목", errors)
              kr_rows.sort(key=lambda r: r["change_pct"] or -999, reverse=True)
              result["kr_watchlist"] = kr_rows

              # --- 국내 전체 시장 스캔 (관심 종목 밖의 국내 단독 재료)
              # 거래일 목록은 방금 받은 국내 종목 데이터에서 뽑는다.
              # pykrx 지수 조회는 GitHub Actions에서 실패하므로 쓰지 않는다.
              scan, scan_err = scan_kr_universe(set(KR_WATCHLIST), now_kst,
                                                stats, errors)
              result["kr_market_scan"] = scan
              if scan_err:
                  errors.append(f"국내 전체 스캔: {scan_err}")
              if scan and result["kr_date"] and scan["date"] != result["kr_date"]:
                  errors.append(
                      f"국내 기준일 불일치 — 관심종목 {result['kr_date']} / "
                      f"전체 스캔 {scan['date']}"
                  )

              # --- 신선도 점검
              # errors가 비어 있어도 데이터가 낡을 수 있다는 것이 2026-09-01에
              # 확인됐다. 수집기 스스로 날짜를 대조해 남긴다.
              expected = prev_business_day(now_kst.date()).isoformat()
              result["freshness"] = {
                  "run_kst": now_kst.strftime("%Y-%m-%d %H:%M:%S"),
                  "expected_prev_business_day": expected,
                  "us_date": result.get("us_date"),
                  "kr_date": result.get("kr_date"),
                  "incomplete_bars_dropped": dict(stats),
              }
              for label, key in (("미국", "us_date"), ("국내", "kr_date")):
                  got = result.get(key)
                  if got and got < expected:
                      errors.append(
                          f"{label} 기준일이 예상보다 이릅니다 (기준일 {got}, "
                          f"직전 영업일 {expected}). 공휴일이면 정상일 수 있으니 "
                          f"확인이 필요합니다."
                      )
                  if got and got > expected:
                      errors.append(
                          f"{label} 기준일이 직전 영업일보다 나중입니다 "
                          f"(기준일 {got}, 직전 영업일 {expected}). 진행 중인 봉이 "
                          f"섞였을 수 있습니다."
                      )

              # --- 저장
              os.makedirs("data", exist_ok=True)
              stamp = now_kst.strftime("%Y-%m-%d")
              for path in (f"data/{stamp}.json", "data/latest.json"):
                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(result, f, ensure_ascii=False, indent=2)

              print(f"미국 기준일: {result['us_date']} / 한국 기준일: {result['kr_date']}"
                    f" / 직전 영업일(주말만 반영): {expected}")
              print(f"나스닥100 수신 {result['ndx_count']}종목 "
                    f"(강세 {len(result['ndx_gainers'])} / 약세 {len(result['ndx_losers'])})")
              print(f"국내 수신 {len(kr_rows)}종목")
              if stats:
                  print(f"미완성 당일 봉 제외: {stats}")
              if errors:
                  print("경고:", *errors, sep="\n  ")
              else:
                  print("경고 없음")


          if __name__ == "__main__":
              main()
