name: 미장 마감 시세 수집

on:
  schedule:
    # GitHub의 schedule 이벤트는 best-effort라 부하가 높으면 밀린다.
    # 특히 정각(:00) 슬롯이 가장 붐빈다. 2026-08-31 회차는 140분 지연돼
    # 09:20 KST(개장 20분 뒤)에야 돌았고, 09-01 회차는 아예 오지 않았다.
    # → 정각을 피하고 백업 슬롯을 둔다. 같은 날짜 파일을 덮어쓰므로
    #   두 번 돌아도 안전하다(멱등).
    - cron: "10 22 * * 0-4"   # 22:10 UTC = 07:10 KST (일~목 UTC → 한국 월~금) 1차
    - cron: "10 23 * * 0-4"   # 23:10 UTC = 08:10 KST 백업
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # tzdata: zoneinfo가 미국 동부 시간(서머타임 포함)을 계산하는 데 쓴다.
      - run: pip install --quiet yfinance pandas lxml tzdata

      - name: 시세 수집
        run: |
          cat > fetch_market.py <<'PYEOF'
          """
          미장 마감 → 국장 개장 전 브리핑: 시세 수집 스크립트

          GitHub Actions에서 매 거래일 실행된다.
          yfinance로 미국(나스닥100 + 섹터 ETF)과 한국(관심 종목) 시세를 받아
          계산까지 마친 JSON을 data/ 아래에 저장한다.

          Claude는 이 JSON만 읽는다. 웹페이지에서 숫자를 긁지 않는다.
